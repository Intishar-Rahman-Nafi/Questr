name: CI/CD

# Continuous Integration + Deployment for a single Oracle Cloud VM.
#
#   Job 1 (test)    — runs on every push & PR: backend tests (Testcontainers)
#                     + frontend typecheck/build. Gates the deploy.
#   Job 2 (deploy)  — runs on push to master only, after tests pass: SSHes into
#                     the VM, pulls the latest code, rebuilds & restarts the
#                     Docker stack, then waits for the backend healthcheck and
#                     verifies the public endpoint.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SERVER_HOST     = VM public IP  (e.g. 140.238.100.38)
#   SERVER_USER     = SSH username  (opc)
#   SERVER_SSH_KEY  = private key of a dedicated deploy key (no passphrase)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ===========================================================================
  # Job 1 — Test (always runs; gates deployment)
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        run: ./mvnw -B clean test

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend (typecheck + vite build)
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ===========================================================================
  # Job 2 — Deploy (push to master only, after tests pass)
  # ===========================================================================
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/questr

            # Force-sync tracked files to origin/master (.env is untracked, so
            # production secrets are never overwritten).
            git fetch origin master
            git reset --hard origin/master

            # Rebuild + restart the full stack (Docker layer cache makes this
            # fast when only app code changed).
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f

            # Wait for the backend healthcheck to pass (fail loudly if it doesn't).
            echo "Waiting for backend to become healthy..."
            healthy=0
            for i in $(seq 1 24); do
              status=$(docker inspect --format='{{.State.Health.Status}}' questr-backend-prod 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "Backend is healthy."
                healthy=1
                break
              fi
              sleep 5
            done
            if [ "$healthy" != "1" ]; then
              echo "ERROR: backend did not become healthy within 120s"
              docker compose -f docker-compose.prod.yml logs backend --tail 80
              exit 1
            fi

            # Verify the public endpoint serves correctly.
            curl -sf http://localhost/ -o /dev/null && echo "Frontend serving OK (200)"
            curl -sf http://localhost/actuator/health && echo ""
