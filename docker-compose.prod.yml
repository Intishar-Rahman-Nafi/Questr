# Production Docker Compose — QUESTR
# Usage: docker compose -f docker-compose.prod.yml up -d
# All secrets come from environment variables — never hardcoded here.
# The frontend image bundles its own Nginx config (frontend/nginx.conf.template).
#
# IMPORTANT — Project isolation:
# `name:` below gives this stack its own Compose "project" identity
# (questr-prod), completely separate from docker-compose.yml's default
# project (named after the folder, e.g. "quest"). Without this, Compose
# matches containers across files by service name + project, and running
# this file WOULD RECREATE/DESTROY your local dev postgres/redis/kafka
# containers (learned this the hard way during Module 10 validation).
# Volume names are also suffixed with _prod for the same defense-in-depth
# reason — even if the project name were ever accidentally shared, prod and
# dev data volumes can never collide.
name: questr-prod

services:

  postgres:
    image: postgres:15-alpine
    container_name: questr-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - questr-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: questr-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis_data_prod:/data
    networks:
      - questr-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: questr-kafka-prod
    restart: always
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data_prod:/var/lib/kafka/data
    networks:
      - questr-net
    healthcheck:
      # Kafka's PLAINTEXT listener is configured as "kafka:29092" (bound to the
      # resolved IP of hostname "kafka", NOT to loopback/0.0.0.0) — so the
      # healthcheck must dial "kafka:29092", not "localhost:29092", even though
      # this command runs inside the same container. Using "localhost" here
      # would silently fail every single health check.
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: questr-backend:latest
    container_name: questr-backend-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - questr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # ─────────────────────────────────────────────────────────────────────────
  # Nginx — built from frontend/Dockerfile (self-contained: context = ./frontend).
  # This single image bundles the compiled React static assets AND the Nginx
  # config that reverse-proxies /api/* to the backend container. There's no
  # separate "frontend" service or shared volume needed — the multi-stage
  # frontend/Dockerfile produces the final serving image directly.
  # ─────────────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: questr-frontend:latest
    container_name: questr-nginx-prod
    restart: always
    ports:
      - "80:80"
      # 443 intentionally omitted — nginx only listens on port 80 today.
      # To add HTTPS: terminate TLS with a tool like Caddy/Traefik in front of
      # this stack, or mount certs + add a `listen 443 ssl;` server block to
      # nginx.conf.template and expose "443:443" here.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - questr-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  kafka_data_prod:
    driver: local

networks:
  questr-net:
    driver: bridge
    name: questr-net-prod

