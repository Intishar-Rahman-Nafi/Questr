# =============================================================================
# QUESTR — Nginx configuration
#
# Responsibilities (this is the ONLY public entry point to the whole stack):
#   1. Serve the built React SPA static files (HTML/JS/CSS)
#   2. Reverse-proxy /api/* to the Spring Boot backend container
#   3. SPA fallback routing (try_files) so refreshing on e.g. /dashboard
#      doesn't 404 — React Router handles the route client-side
#   4. Gzip compression for text-based assets
#   5. Sane security headers + real client IP forwarding to the backend
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Rate limiting (brute-force / abuse protection) ──────────────────────
    # Keyed by client IP, tracked in a 10MB shared-memory zone (~160k IPs).
    # "auth" zone is intentionally stricter — signup/login are the highest-value
    # targets for credential stuffing / brute force. "api" zone protects the
    # rest of the API from generic scraping/abuse without impacting normal use.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # Security headers — reduce common attack surface (clickjacking, MIME
        # sniffing, XSS via reflected content).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /usr/share/nginx/html;
        index index.html;

        # ── Auth endpoints — tighter rate limit ──────────────────────────────
        # Regex locations are checked after prefix locations but take priority
        # over a non-exact prefix match like /api/ when they match, so this is
        # correctly hit for signup/login/refresh instead of falling through.
        location ~* ^/api/v1/auth/(signup|login|refresh)$ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;
        }

        # ── API reverse proxy ────────────────────────────────────────────────
        # The React app calls relative paths like /api/v1/tasks. Nginx forwards
        # them to the backend container over the internal Docker network — the
        # backend is NEVER exposed directly to the internet.
        location /api/ {
            limit_req zone=api burst=40 nodelay;

            proxy_pass http://backend:8080/api/;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Generous timeouts — the OpenAI weekly-report endpoint can take
            # up to ~35s (see OpenAIService's WebClient block(Duration.ofSeconds(35))).
            proxy_connect_timeout 10s;
            proxy_send_timeout    40s;
            proxy_read_timeout    40s;
        }

        # Actuator health check — useful for uptime monitors hitting Nginx
        # directly instead of needing to reach the backend port.
        location /actuator/ {
            proxy_pass http://backend:8080/actuator/;
            proxy_set_header Host $host;
        }

        # ── Static assets (JS/CSS/images) ────────────────────────────────────
        # Vite fingerprints filenames (e.g. index-a1b2c3.js), so these are safe
        # to cache aggressively — a new deploy produces new filenames.
        location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── SPA fallback ──────────────────────────────────────────────────────
        # Any route not matched above (e.g. /dashboard, /challenges/abc123) is
        # NOT a real file on disk — it's a client-side React Router route.
        # Serve index.html and let React Router take over. Without this,
        # refreshing the browser on any non-root route would 404.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
