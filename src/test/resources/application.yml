# Test configuration — overrides main application.yml for the test classpath.
# Testcontainers wires the real URLs at runtime via @DynamicPropertySource.
# These placeholder values satisfy Spring's relaxed binding validation
# before Testcontainers replaces them.

spring:
  # JPA — DDL validation disabled in tests; Flyway handles schema creation.
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  # Flyway — enabled; Testcontainers will override datasource URL dynamically.
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis — placeholder; overridden by @DynamicPropertySource in tests.
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka — placeholder; overridden by @DynamicPropertySource or EmbeddedKafka.
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: questr-test-group
      auto-offset-reset: earliest

  # Use a fixed H2 datasource placeholder that Testcontainers will override.
  datasource:
    url: jdbc:postgresql://localhost:5432/questr_test
    username: admin
    password: secret

# JWT — deterministic secret for tests
jwt:
  secret: test-secret-key-for-unit-tests-only-must-be-32-chars-min
  expiration-ms: 3600000   # 1 hour

# OpenAI — disabled in tests; mock the WebClient
openai:
  api-key: test-key
  model: gpt-4o-mini

# Actuator — expose all in test
management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.app.questr: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG

