# ─────────────────────────────────────────────────────────────────────────────
# Test configuration — overrides main application.yml for the test classpath.
#
# This file sets SAFE DEFAULTS for ALL test slices.
#
#   @DataJpaTest (RepositoryIntegrationTest)
#     • flyway.enabled=false  → Flyway bean not created; Hibernate owns DDL
#     • ddl-auto=create-drop  → schema is created fresh per test context
#     • @Sql("/test-badge-data.sql") seeds badge data (no Flyway needed)
#     • @ServiceConnection wires Testcontainers Postgres automatically
#
#   @SpringBootTest (QuestrApplicationTests)
#     • That class overrides flyway.enabled=true + ddl-auto=none via
#       @SpringBootTest(properties = {...}) so Flyway runs its full V1-V6 chain
#     • Redis/Kafka use the placeholder values below — no real broker needed at
#       startup because no listeners/cache-ops fire during contextLoads()
#
# ─────────────────────────────────────────────────────────────────────────────

spring:
  # ── JPA ─────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: create-drop     # default for all slices; overridden per-test
    show-sql: true
    properties:
      hibernate:
        # Explicit dialect prevents "Unable to determine Dialect" errors
        # when the JDBC connection is not immediately available at bootstrap.
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Flyway ──────────────────────────────────────────────────────────────
  flyway:
    enabled: false              # safe default; @SpringBootTest overrides to true

  # ── Datasource ──────────────────────────────────────────────────────────
  # @ServiceConnection replaces this at runtime. Kept as localhost fallback.
  datasource:
    url: jdbc:postgresql://localhost:5432/questr_db
    username: admin
    password: secret

  # ── Redis ────────────────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

  # ── Kafka ────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: questr-test-group
      auto-offset-reset: earliest

# ── JWT — deterministic secret for all tests ─────────────────────────────────
jwt:
  secret: test-secret-key-for-unit-tests-only-must-be-at-least-32-chars
  expiration: 3600000            # 1 hour in ms
  refresh-expiration: 86400000   # 24 hours in ms

# ── OpenAI — mocked in tests ─────────────────────────────────────────────────
openai:
  api-key: test-key
  model: gpt-4o-mini

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: "*"

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.app.questr: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

